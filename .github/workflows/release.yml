name: Release (signed store build)

# Manual only. Builds the Bazaar-ready AAB + APK signed with YOUR upload key,
# which lives in GitHub Secrets (never in git). The files are attached to the
# run as a private workflow artifact (not published anywhere).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   LATER_KEYSTORE_BASE64   base64 of later-release.jks   (base64 -w0 later-release.jks)
#   LATER_KEYSTORE_PASSWORD
#   LATER_KEY_ALIAS         (later)
#   LATER_KEY_PASSWORD
#   LATER_PRO_SIGNING_KEY   long random string, keep it the same for every release
#   BAZAAR_RSA_KEY          public key from the Bazaar developer panel

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  release:
    name: Build signed AAB / APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Check secrets are present
        env:
          A: ${{ secrets.LATER_KEYSTORE_BASE64 }}
          B: ${{ secrets.LATER_KEYSTORE_PASSWORD }}
          C: ${{ secrets.LATER_KEY_ALIAS }}
          D: ${{ secrets.LATER_KEY_PASSWORD }}
          E: ${{ secrets.LATER_PRO_SIGNING_KEY }}
          F: ${{ secrets.BAZAAR_RSA_KEY }}
        run: |
          for v in A B C D E F; do
            if [ -z "${!v}" ]; then echo "::error::A required secret is missing (see the comment at the top of release.yml)"; exit 1; fi
          done

      - name: Analyze and test
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          flutter analyze
          flutter test

      - name: Decode keystore
        env:
          KS: ${{ secrets.LATER_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/later-release.jks"
          echo "LATER_KEYSTORE_FILE=$RUNNER_TEMP/later-release.jks" >> "$GITHUB_ENV"

      - name: Build store AAB and APK
        env:
          LATER_KEYSTORE_PASSWORD: ${{ secrets.LATER_KEYSTORE_PASSWORD }}
          LATER_KEY_ALIAS: ${{ secrets.LATER_KEY_ALIAS }}
          LATER_KEY_PASSWORD: ${{ secrets.LATER_KEY_PASSWORD }}
          PRO: ${{ secrets.LATER_PRO_SIGNING_KEY }}
          RSA: ${{ secrets.BAZAAR_RSA_KEY }}
        run: |
          flutter build appbundle --release --flavor store \
            --dart-define=LATER_PRO_SIGNING_KEY="$PRO" --dart-define=BAZAAR_RSA_KEY="$RSA"
          flutter build apk --release --flavor store \
            --dart-define=LATER_PRO_SIGNING_KEY="$PRO" --dart-define=BAZAAR_RSA_KEY="$RSA"

      - name: Verify the APK is signed with the upload key and has no QA tools / INTERNET
        run: |
          APK=build/app/outputs/flutter-apk/app-store-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|uses-permission" || true
          if "$BT/aapt2" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::INTERNET permission found in the store build"; exit 1
          fi

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/later-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: later-store-release
          retention-days: 14
          path: |
            build/app/outputs/bundle/storeRelease/app-store-release.aab
            build/app/outputs/flutter-apk/app-store-release.apk

name: Emulator tests

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['integration_test/**', 'android/**', 'lib/**', 'tool/ci/**', '.github/workflows/emulator.yml']

concurrency:
  group: emu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [31, 33, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }
      - run: flutter pub get
      - name: Run integration tests + adb scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell settings put global auto_time_zone 1 || true
            flutter build apk --debug --flavor qa --dart-define=LATER_PRO_SIGNING_KEY=qa-only-signing-key
            adb install -r build/app/outputs/flutter-apk/app-qa-debug.apk
            adb shell pm grant app.baadan.later.qa android.permission.POST_NOTIFICATIONS || true
            adb shell appops set app.baadan.later.qa SCHEDULE_EXACT_ALARM allow || true
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/device_test.dart --flavor qa --dart-define=LATER_PRO_SIGNING_KEY=qa-only-signing-key --keep-app-running -d emulator-5554 2>&1 | tee integration.log
            adb shell pm list packages | grep app.baadan.later.qa || adb install -r build/app/outputs/flutter-apk/app-qa-debug.apk
            PKG=app.baadan.later.qa REPORT=scenario-report.txt bash tool/ci/android_scenarios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api${{ matrix.api }}
          path: |
            integration.log
            scenario-report.txt

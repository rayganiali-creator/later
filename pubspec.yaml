name: later
description: "بعداً (Later) - الان لازم نیست؛ فقط فراموشش نکن. A local-first, offline-first later-list app."
publish_to: 'none'

# version: <versionName>+<versionCode>. Bump both for every store release.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Local database (uses the platform SQLite on Android, no network needed)
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # Reminders (local notifications, boot-persistent)
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Pro entitlement storage (Android Keystore backed)
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.6

  # Backup / restore (system file picker, Storage Access Framework)
  file_picker: ^13.1.0

  # Misc
  url_launcher: ^6.3.2
  shamsi_date: ^1.1.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/legal/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
